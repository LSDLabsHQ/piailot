<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piailot:ai</title>
<script src="/themes.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a; --surface: #111111; --border: #1a1a1a;
    --green: #00ff41; --green-dim: #00aa2a; --green-glow: rgba(0,255,65,0.15);
    --amber: #ffb000; --red: #ff3333; --cyan: #00d4ff;
    --text: #c0c0c0; --text-dim: #606060;
    --sidebar-w: 260px;
  }
  body {
    font-family: var(--font, 'JetBrains Mono', 'Courier New', monospace);
    background: var(--bg); color: var(--text);
    height: 100dvh; display: flex; overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100dvh;
    transition: transform 0.25s ease;
    z-index: 100;
  }
  .sidebar-user {
    padding: 14px 14px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sidebar-user .uname {
    color: var(--green); font-size: 0.82em; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sidebar-user .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--red);
    font-family: inherit; font-size: 0.7em; padding: 3px 8px;
    border-radius: 3px; cursor: pointer; white-space: nowrap;
  }
  .sidebar-user .logout-btn:hover { background: rgba(255,51,51,0.1); }

  .sidebar-actions { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-actions button, .sidebar-actions a {
    display: block; width: 100%; background: none; border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 0.8em;
    padding: 8px 10px; border-radius: 4px; cursor: pointer;
    text-decoration: none; text-align: left;
  }
  .sidebar-actions button:hover, .sidebar-actions a:hover {
    border-color: var(--green-dim); color: var(--green);
  }
  .sidebar-actions .new-chat-btn { color: var(--green); border-color: var(--green-dim); }
  .sidebar-actions .new-chat-btn:hover { background: var(--green-glow); }

  .sidebar-label {
    padding: 10px 14px 4px; font-size: 0.68em; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
  }

  #convo-list {
    flex: 1; overflow-y: auto; padding: 4px 8px 12px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #convo-list::-webkit-scrollbar { width: 4px; }
  #convo-list::-webkit-scrollbar-track { background: transparent; }
  #convo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .convo-item {
    display: flex; align-items: center; gap: 4px;
    padding: 7px 8px; border-radius: 4px; cursor: pointer;
    font-size: 0.78em; color: var(--text-dim); margin-bottom: 2px;
    transition: background 0.15s;
  }
  .convo-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .convo-item.active { background: var(--green-glow); color: var(--green); }
  .convo-item .convo-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .convo-item .convo-date {
    font-size: 0.75em; color: var(--text-dim); white-space: nowrap; margin-right: 2px;
  }
  .convo-item .convo-del {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 0.9em; font-family: inherit; padding: 0 3px; line-height: 1;
    opacity: 0; transition: opacity 0.15s;
  }
  .convo-item:hover .convo-del { opacity: 1; }
  .convo-item .convo-del:hover { color: var(--red); }

  /* ── Main panel ── */
  #main {
    flex: 1; display: flex; flex-direction: column;
    height: 100dvh; min-width: 0;
  }

  /* ── Top bar ── */
  #topbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    background: var(--surface);
  }
  #hamburger {
    display: none; background: none; border: none; color: var(--text);
    font-size: 1.3em; cursor: pointer; padding: 2px 6px; line-height: 1;
  }
  #topbar .logo {
    color: var(--green); font-weight: 700; font-size: 1.05em;
    text-shadow: 0 0 10px var(--green-glow);
  }
  #topbar .logo span { color: var(--text-dim); font-weight: 400; }

  .picker-group { display: flex; gap: 8px; margin-left: auto; align-items: center; }

  select {
    background: var(--bg); color: var(--amber); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 0.78em;
    cursor: pointer; max-width: 200px;
  }
  select:focus { outline: 1px solid var(--amber); }
  #skill-select { color: var(--cyan); }
  #skill-select:focus { outline-color: var(--cyan); }

  #status { font-size: 0.72em; color: var(--text-dim); }

  /* ── Chat area ── */
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { max-width: 85%; line-height: 1.6; font-size: 0.86em; }
  .msg.user {
    align-self: flex-end; color: var(--cyan);
    padding: 8px 12px; border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px 8px 2px 8px; background: rgba(0,212,255,0.05);
  }
  .msg.user::before { content: '> '; color: var(--text-dim); }
  .msg.assistant {
    align-self: flex-start; color: var(--green);
    padding: 8px 12px; border-left: 2px solid var(--green-dim);
    background: var(--green-glow); border-radius: 2px 8px 8px 8px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant.streaming { border-left-color: var(--amber); }
  .msg.error { color: var(--red); border-left-color: var(--red); }

  .tool-label {
    align-self: flex-start; font-size: 0.7em; color: var(--amber);
    padding: 2px 8px; border: 1px solid rgba(255,176,0,0.2);
    border-radius: 3px; background: rgba(255,176,0,0.05);
    margin-bottom: -6px;
  }

  .cursor-blink::after {
    content: '\2588'; animation: blink 0.7s step-end infinite; color: var(--green);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Welcome ── */
  .welcome {
    color: var(--text-dim); font-size: 0.85em; text-align: center;
    padding: 60px 20px; line-height: 1.8; align-self: center;
    margin: auto 0;
  }
  .welcome h2 {
    color: var(--green); font-size: 1.2em; margin-bottom: 8px;
    text-shadow: 0 0 20px var(--green-glow);
  }

  /* ── Input bar ── */
  #input-bar {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; flex-shrink: 0; background: var(--surface);
  }
  #prompt-label { color: var(--green-dim); line-height: 36px; font-size: 0.9em; }
  #input {
    flex: 1; background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 4px;
    font-family: inherit; font-size: 0.86em; resize: none;
    min-height: 36px; max-height: 120px;
  }
  #input:focus { outline: 1px solid var(--green-dim); }
  #send {
    background: var(--green-dim); color: var(--bg); border: none;
    padding: 8px 16px; border-radius: 4px; font-family: inherit;
    font-weight: 700; cursor: pointer; font-size: 0.85em;
  }
  #send:hover { background: var(--green); }
  #send:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Overlay for mobile sidebar ── */
  #sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 90;
  }

  /* ── Mobile responsive ── */
  @media (max-width: 767px) {
    #sidebar {
      position: fixed; left: 0; top: 0; height: 100dvh;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #hamburger { display: block; }
    .picker-group { gap: 4px; }
    select { max-width: 120px; font-size: 0.72em; }
    .msg { max-width: 95%; }
  }
</style>
</head>
<body>

<!-- Sidebar overlay for mobile -->
<div id="sidebar-overlay"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-user">
    <span class="uname" id="user-display">...</span>
    <button class="logout-btn" id="logout-btn">logout</button>
  </div>
  <div class="sidebar-actions">
    <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
    <a href="/skills.html">My Skills</a>
    <a href="/admin.html" id="admin-link" style="display:none">Admin</a>
    <div id="theme-mount"></div>
  </div>
  <div class="sidebar-label">Conversations</div>
  <div id="convo-list"></div>
</aside>

<!-- Main panel -->
<div id="main">
  <div id="topbar">
    <button id="hamburger">&#9776;</button>
    <div class="logo">piailot<span>:ai</span></div>
    <span id="status">ready</span>
    <div class="picker-group">
      <select id="skill-select"><option value="">No Skill</option></select>
      <select id="model-select"></select>
    </div>
  </div>

  <div id="chat">
    <div class="welcome">
      <h2>$ piailot --ai</h2>
      self-hosted ai gateway // openrouter<br>
      powered by openrouter free models<br><br>
      select a conversation or start a new chat_
    </div>
  </div>

  <div id="input-bar">
    <span id="prompt-label">$</span>
    <textarea id="input" rows="1" placeholder="ask piailot anything..." autofocus></textarea>
    <button id="send">SEND</button>
  </div>
</div>

<script>
(function() {
  var sidebar = document.getElementById('sidebar');
  var sidebarOverlay = document.getElementById('sidebar-overlay');
  var hamburger = document.getElementById('hamburger');
  var userDisplay = document.getElementById('user-display');
  var logoutBtn = document.getElementById('logout-btn');
  var newChatBtn = document.getElementById('new-chat-btn');
  var convoList = document.getElementById('convo-list');
  var skillSelect = document.getElementById('skill-select');
  var modelSelect = document.getElementById('model-select');
  var statusEl = document.getElementById('status');
  var chatEl = document.getElementById('chat');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');

  var currentUser = null;
  var conversations = [];
  var activeConvoId = null;
  var messages = [];
  var streaming = false;

  // Auth guard
  async function checkAuth() {
    try {
      var res = await fetch('/api/auth/me');
      if (!res.ok) throw new Error('unauthorized');
      var data = await res.json();
      currentUser = data;
      userDisplay.textContent = data.name || data.username;
      if (data.is_admin) {
        document.getElementById("admin-link").style.display = "";
      }
    } catch (e) {
      window.location.href = '/login.html';
    }
  }

  // Logout
  logoutBtn.addEventListener('click', async function() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login.html';
  });

  // Mobile sidebar toggle
  function toggleSidebar() {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('open');
  }
  hamburger.addEventListener('click', toggleSidebar);
  sidebarOverlay.addEventListener('click', toggleSidebar);

  function closeSidebarMobile() {
    if (window.innerWidth < 768) {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    }
  }

  // Load models
  async function loadModels() {
    try {
      var res = await fetch('/api/models');
      var models = await res.json();
      models.forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        modelSelect.appendChild(opt);
      });
    } catch (e) {
      statusEl.textContent = 'error loading models';
    }
  }

  // Load skills
  async function loadSkills() {
    try {
      var res = await fetch('/api/skills');
      if (!res.ok) return;
      var skills = await res.json();
      skills.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        skillSelect.appendChild(opt);
      });
    } catch (e) { /* skills optional */ }
  }

  // Load conversations
  async function loadConversations() {
    try {
      var res = await fetch('/api/conversations');
      if (!res.ok) return;
      conversations = await res.json();
      renderConvoList();
    } catch (e) { /* ignore */ }
  }

  function renderConvoList() {
    convoList.innerHTML = '';
    conversations.forEach(function(c) {
      var item = document.createElement('div');
      item.className = 'convo-item' + (c.id === activeConvoId ? ' active' : '');

      var title = document.createElement('span');
      title.className = 'convo-title';
      title.textContent = c.title || 'Untitled';

      var date = document.createElement('span');
      date.className = 'convo-date';
      if (c.updated) {
        var d = new Date(c.updated);
        date.textContent = (d.getMonth() + 1) + '/' + d.getDate();
      }

      var del = document.createElement('button');
      del.className = 'convo-del';
      del.innerHTML = '&times;';
      del.title = 'Delete conversation';
      del.addEventListener('click', (function(convId) {
        return async function(e) {
          e.stopPropagation();
          if (!confirm('Delete this conversation?')) return;
          try {
            await fetch('/api/conversations/' + convId, { method: 'DELETE' });
            if (activeConvoId === convId) {
              activeConvoId = null;
              messages = [];
              showWelcome();
            }
            await loadConversations();
          } catch (err) { /* ignore */ }
        };
      })(c.id));

      item.appendChild(title);
      item.appendChild(date);
      item.appendChild(del);
      item.addEventListener('click', (function(convId) {
        return function() { openConversation(convId); };
      })(c.id));
      convoList.appendChild(item);
    });
  }

  // Open conversation
  async function openConversation(id) {
    try {
      statusEl.textContent = 'loading...';
      var res = await fetch('/api/conversations/' + id);
      if (!res.ok) throw new Error('failed to load');
      var convo = await res.json();
      activeConvoId = id;
      messages = convo.messages || [];

      if (convo.model) modelSelect.value = convo.model;
      if (convo.skill) skillSelect.value = convo.skill;
      else skillSelect.value = '';

      renderMessages();
      renderConvoList();
      statusEl.textContent = 'ready';
      closeSidebarMobile();
    } catch (e) {
      statusEl.textContent = 'error loading conversation';
    }
  }

  // Render messages
  function renderMessages() {
    chatEl.innerHTML = '';
    if (messages.length === 0) {
      showWelcome();
      return;
    }
    messages.forEach(function(m) {
      if (m.role === 'user' || m.role === 'assistant') {
        var text = m.content || '';
        if (m.role === 'assistant') {
          var toolMatch = text.match(/^\[using ([^\]]+)\]\s*/);
          if (toolMatch) {
            var label = document.createElement('div');
            label.className = 'tool-label';
            label.textContent = '\u2692 ' + toolMatch[1];
            chatEl.appendChild(label);
            text = text.slice(toolMatch[0].length);
          }
        }
        var div = document.createElement('div');
        div.className = 'msg ' + m.role;
        div.textContent = text;
        chatEl.appendChild(div);
      }
    });
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showWelcome() {
    chatEl.innerHTML = '<div class="welcome"><h2>$ piailot --ai</h2>self-hosted ai gateway // openrouter<br>powered by openrouter free models<br><br>select a conversation or start a new chat_</div>';
  }

  // New chat
  newChatBtn.addEventListener('click', async function() {
    try {
      statusEl.textContent = 'creating...';
      var model = modelSelect.value;
      var skill = skillSelect.value || null;
      var res = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ skill: skill, model: model })
      });
      if (!res.ok) throw new Error('failed');
      var convo = await res.json();
      activeConvoId = convo.id;
      messages = [];
      showWelcome();
      await loadConversations();
      statusEl.textContent = 'ready';
      closeSidebarMobile();
      inputEl.focus();
    } catch (e) {
      statusEl.textContent = 'error creating chat';
    }
  });

  // Save conversation
  async function saveConversation() {
    if (!activeConvoId) return;
    try {
      var skill = skillSelect.value || null;
      var model = modelSelect.value;
      await fetch('/api/conversations/' + activeConvoId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages, skill: skill, model: model })
      });
      await loadConversations();
    } catch (e) { /* ignore */ }
  }

  // Send message
  async function send() {
    var text = inputEl.value.trim();
    if (!text || streaming) return;

    // Auto-create conversation if none active
    if (!activeConvoId) {
      try {
        var model = modelSelect.value;
        var skill = skillSelect.value || null;
        var cRes = await fetch('/api/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ skill: skill, model: model })
        });
        if (!cRes.ok) throw new Error('failed');
        var convo = await cRes.json();
        activeConvoId = convo.id;
        messages = [];
        await loadConversations();
      } catch (e) {
        statusEl.textContent = 'error creating chat';
        return;
      }
    }

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    statusEl.textContent = 'thinking...';

    var welcome = chatEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    var userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    userDiv.textContent = text;
    chatEl.appendChild(userDiv);
    messages.push({ role: 'user', content: text });

    var assistantDiv = document.createElement('div');
    assistantDiv.className = 'msg assistant streaming cursor-blink';
    chatEl.appendChild(assistantDiv);
    chatEl.scrollTop = chatEl.scrollHeight;

    var toolLabel = null;

    try {
      var body = { messages: messages, model: modelSelect.value };
      var sk = skillSelect.value;
      if (sk) body.skill = sk;

      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var full = '';

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        var chunk = decoder.decode(result.value);
        var lines = chunk.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
          try {
            var json = JSON.parse(line.slice(6));
            var delta = '';
            if (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) {
              delta = json.choices[0].delta.content;
            }
            full += delta;

            var tm = full.match(/^\[using ([^\]]+)\]\s*/);
            if (tm && !toolLabel) {
              toolLabel = document.createElement('div');
              toolLabel.className = 'tool-label';
              toolLabel.textContent = '\u2692 ' + tm[1];
              chatEl.insertBefore(toolLabel, assistantDiv);
            }

            var displayText = full;
            if (tm) displayText = full.slice(tm[0].length);
            assistantDiv.textContent = displayText;
            chatEl.scrollTop = chatEl.scrollHeight;
          } catch (pe) { /* ignore parse errors */ }
        }
      }

      messages.push({ role: 'assistant', content: full });
      statusEl.textContent = 'ready';
      await saveConversation();

    } catch (e) {
      assistantDiv.classList.add('error');
      assistantDiv.textContent = 'connection error: ' + e.message;
      statusEl.textContent = 'error';
    }

    assistantDiv.classList.remove('streaming', 'cursor-blink');
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Theme picker
  piailotThemes.picker(document.getElementById('theme-mount'));

  // Init
  async function init() {
    await checkAuth();
    await Promise.all([loadModels(), loadSkills(), loadConversations()]);
  }
  init();
})();
</script>
</body>
</html>
